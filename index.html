<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My APK Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>My APK Builder</h1>
        <p>Real ZIP → Android APK</p>
    </div>

    <div class="card">

        <label>GitHub Username</label>
        <input id="githubUser" type="text" placeholder="yourusername">

        <label>Repository Name</label>
        <input id="githubRepo" type="text" placeholder="MyAPKBuilder">

        <label>GitHub Token</label>
        <input id="githubToken" type="password" placeholder="github_pat_...">

        <div class="note">
            Token sirf tumhare GitHub account ke liye use hoga.
        </div>

        <label>App Name</label>
        <input id="appName" type="text" value="My Web App">

        <label>Package Name</label>
        <input id="packageName" type="text" value="com.example.mywebapp">

        <label>Version Name</label>
        <input id="versionName" type="text" value="1.0">

        <label>Website ZIP</label>

        <div class="upload">
            <input id="zipFile" type="file" accept=".zip">
            <span id="fileName">Choose ZIP file</span>
        </div>

        <label>App Icon</label>

        <div class="upload">
            <input id="iconFile" type="file" accept="image/png,image/jpeg">
            <span id="iconName">Choose PNG/JPG icon</span>
        </div>

        <button id="buildBtn">
            Build APK
        </button>

        <div id="status">
            Ready.
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
