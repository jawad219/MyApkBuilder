name: Build Custom APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Read build configuration
        shell: bash
        run: |
          if [ ! -f builder-input/config.json ]; then
            echo "config.json not found"
            exit 1
          fi

          if [ ! -f builder-input/app.zip ]; then
            echo "app.zip not found"
            exit 1
          fi

          if [ ! -f builder-input/app_icon.png ]; then
            echo "app_icon.png not found"
            exit 1
          fi

          APP_NAME=$(python3 -c "import json; print(json.load(open('builder-input/config.json'))['appName'])")
          PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('builder-input/config.json'))['packageName'])")
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('builder-input/config.json'))['versionName'])")

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "App: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION_NAME"

      - name: Extract website ZIP
        shell: bash
        run: |
          mkdir -p website

          unzip -o builder-input/app.zip -d website

          echo "ZIP contents:"
          find website -maxdepth 4 -type f

          INDEX=$(find website -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "index.html not found inside ZIP"
            exit 1
          fi

          WEBSITE_ROOT=$(dirname "$INDEX")

          echo "Website root: $WEBSITE_ROOT"

          mkdir -p android-app/app/src/main/assets

          cp -R "$WEBSITE_ROOT"/. android-app/app/src/main/assets/

      - name: Create Android project
        shell: bash
        run: |
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p "android-app/app/src/main/java/$PACKAGE_PATH"
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          cp builder-input/app_icon.png \
            android-app/app/src/main/res/drawable/app_icon.png

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CustomAPK"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 35

              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '$VERSION_NAME'
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="$APP_NAME"
                  android:icon="@drawable/app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#000000</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>

              </style>
          </resources>
          EOF

          cat > "android-app/app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
          package $PACKAGE_NAME;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd android-app
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
